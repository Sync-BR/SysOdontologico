<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Exames do Paciente</title>
    <link rel="stylesheet" href="/css/styles.css"> <!-- Link para o CSS -->
</head>
<body>
<style>
    /* Corpo da página */
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f4;
        color: #333;
    }

    /* Cabeçalho */
    header {
        background-color: #007bff;
        color: white;
        padding: 20px;
        text-align: center;
        font-size: 24px;
    }

    /* Conteúdo principal */
    main {
        padding: 20px;
    }

    /* Seção */
    section {
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        padding: 20px;
        margin-bottom: 40px;
    }

    /* Tabela */
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        font-size: 16px;
    }

    table th, table td {
        padding: 12px 15px;
        text-align: left;
        border: 1px solid #ddd;
    }

    table th {
        background-color: #007bff;
        color: white;
    }

    table tr:nth-child(even) {
        background-color: #f9f9f9;
    }

    table tr:hover {
        background-color: #f1f1f1;
    }

    /* Mensagem quando não há exames */
    div[th\\:if='${patients.isEmpty()}'] {
        text-align: center;
        padding: 20px;
        font-size: 18px;
        color: #777;
    }

    /* Rodapé */
    footer {
        text-align: center;
        padding: 10px;
        background-color: #007bff;
        color: white;
        position: fixed;
        bottom: 0;
        width: 100%;
    }

    footer p {
        margin: 0;
    }
    .button-view-image {
        background-color: #28a745; /* Cor verde */
        color: white; /* Texto branco */
        border: none; /* Sem borda */
        border-radius: 5px; /* Bordas arredondadas */
        padding: 10px 15px; /* Padding do botão */
        cursor: pointer; /* Cursor de mão ao passar o mouse */
        transition: background-color 0.3s; /* Transição suave para a mudança de cor */
        font-size: 16px; /* Tamanho da fonte */
        text-align: center; /* Centraliza o texto */
    }

    .button-view-image:hover {
        background-color: #218838; /* Cor verde mais escura ao passar o mouse */
    }
    /* Estilo do Modal */
    .modal {
        display: none; /* Oculta o modal por padrão */
        position: fixed; /* Fica fixo na tela */
        z-index: 1; /* Fica acima de outros elementos */
        left: 0;
        top: 0;
        margin: 100px 0 100px 0;
        width: 100%; /* Largura total */
        height: 100%; /* Altura total */
        overflow: auto; /* Permite rolagem se necessário */
        background-color: rgba(0, 0, 0, 0.8); /* Fundo preto semi-transparente */
    }

    .modal-content {
        margin: auto;
        display: block;
        max-width: 80%; /* Limite a largura da imagem */
        max-height: 80%; /* Limite a altura da imagem */
    }

    .close {
        position: absolute;
        top: 15px;
        right: 35px;
        color: white; /* Cor do botão de fechar */
        font-size: 40px;
        font-weight: bold;
        cursor: pointer; /* Cursor de mão ao passar o mouse */
    }

    .close:hover,
    .close:focus {
        color: #bbb; /* Cor ao passar o mouse */
        text-decoration: none; /* Sem sublinhado */
        cursor: pointer; /* Cursor de mão */
    }
    .img-zoom-container {
        position: relative;
        display: inline-block;
    }

    .img-zoom-lens {
        border: 1px solid #000;
        position: absolute;
        display: none;
        cursor: crosshair;
        width: 100px; /* Tamanho da lente */
        height: 100px; /* Tamanho da lente */
        border-radius: 50%; /* Lente circular */
        overflow: hidden;
    }

    .img-zoom-result {
        border: 1px solid #d4d4d4;
        display: none;
        position: absolute;
        z-index: 10;
        background-color: white;
        border-radius: 10px;
    }
</style>
<header>
    <h1>Exames do Paciente</h1>
</header>

<main>
    <section>
        <div th:if="${patients.isEmpty()}">
            <p>Não há exames registrados para este paciente.</p>
        </div>
        <div th:unless="${patients.isEmpty()}">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Descrição</th>
                    <th>Tipo de Exame</th>
                    <th>Data</th>
                    <th>Clínica</th>
                    <th>Dente</th>
                    <th>Dentista</th>
                    <th>Anexo</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="exam : ${patients}">
                    <td th:text="${exam.id}"></td>
                    <td th:text="${exam.description}"></td>
                    <td th:text="${exam.examType.getDescription()}"></td>
                    <td th:text="${#temporals.format(exam.date, 'dd/MM/yyyy')}"></td>
                    <td th:text="${exam.clinic.getId()}"></td>
                    <td th:text="${exam.getTooth().getDescription()}"></td>
                    <td th:text="${exam.getDentist().getName()}"></td>
                    <td>
                        <button type="button" class="button-view-image"
                                th:data-image="${exam.getMediaPatch()}"
                                th:data-description="${exam.description}"
                                onclick="openModal(this.dataset.image, this.dataset.description)">
                            Visualizar Imagem
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
    <div id="imageModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="modalImage" alt="Imagem do Exame">
        <div id="caption"></div>
    </div>
</main>

<footer>
    <p>© 2024 - Sistema SysOdontologico</p>
</footer>

</body>
<script>
    function openModal(imageSrc, description) {
        const modal = document.getElementById("imageModal");
        const modalImage = document.getElementById("modalImage");
        const captionText = document.getElementById("caption");

        modal.style.display = "block";
        modalImage.src = imageSrc;
        captionText.innerHTML = description; // Adiciona descrição se necessário
    }

    function closeModal() {
        const modal = document.getElementById("imageModal");
        modal.style.display = "none";
    }

    window.onclick = function(event) {
        const modal = document.getElementById("imageModal");
        if (event.target == modal) {
            modal.style.display = "none";
        }
    }
</script>
</html>
