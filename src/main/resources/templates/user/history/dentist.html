<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Histórico do Dentista</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<style>
    /* Resetando margens e padding */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    /* Estilo geral do corpo */
    body {
        font-family: 'Arial', sans-serif;
        background-color: #f0f4f8;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        padding: 20px;
        flex-direction: column;
    }

    /* Título principal */
    h1 {
        font-size: 30px;
        margin-bottom: 20px;
        color: #4A90E2;
        text-align: center;
    }

    /* Estilo do contêiner de dados do paciente */
    div {
        width: 100%;
        background-color: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
    }

    /* Subtítulo de dados do paciente */
    h2 {
        font-size: 24px;
        margin-bottom: 20px;
        color: #333;
    }

    /* Estilo da tabela */
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th, td {
        padding: 15px;
        text-align: left;
        border-bottom: 1px solid #ddd;
    }

    th {
        background-color: #4A90E2;
        color: white;
        font-weight: bold;
    }

    td {
        background-color: #f9f9f9;
        color: #333;
    }

    /* Estilo para linhas alternadas da tabela */
    tbody tr:nth-child(odd) {
        background-color: #f1f5f9;
    }

    /* Melhorando o hover nas linhas */
    tbody tr:hover {
        background-color: #e4f0f9;
        cursor: pointer;
    }

</style>
<h1>Histórico do Dentista</h1>
<div>
    <h2>Dados do Paciente</h2>
    <table border="1">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>CPF</th>
            <th>Gênero</th>
            <th>Data de Nascimento</th>
            <th>Telefone</th>
            <th>Email</th>
            <th>Endereço</th>
            <th>CEP</th>
            <th>Número da Casa</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="paciente : ${dentist}">
            <td th:text="${paciente.id}"></td>
            <td th:text="${paciente.name}"></td>
            <td th:text="${paciente.cpf}"></td>
            <td th:text="${paciente.gender}"></td>
            <td th:text="${paciente.dateOfBirth}"></td>
            <td th:text="${paciente.telephone}"></td>
            <td th:text="${paciente.email}"></td>
            <td th:text="${paciente.address}"></td>
            <td th:text="${paciente.cep}"></td>
            <td th:text="${paciente.houseNumber}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
