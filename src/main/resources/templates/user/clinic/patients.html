<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./../../src/style/reset.css">
    <link rel="stylesheet" href="./../../src/style/user/patients.css">
    <link rel="stylesheet" href="./../../src/style/message.css">
    <title>Registrar Paciente</title>
</head>

<body>
<main>
    <div th:if="${message}" class="errorMessage" role="alert">
        <p th:text="${message}"></p>
        <button class="close-btn" onclick="this.parentElement.style.display='none'">×</button>
    </div>
    <div th:if="${messageSucess}" class="sucessMessage" role="alert">
        <p th:text="${messageSucess}"></p>
        <button class="close-btn" onclick="this.parentElement.style.display='none'">×</button>
    </div>
    <div class="container">
        <h1>Registrar Novo Paciente</h1>
        <form action="/WEr09VEBRA1rcRXkk10CyhRs5oNmekpCzPLNC1f1qqnplCVOQT8Cr" method="POST">
            <fieldset>
                <legend>Dados Pessoais</legend>
                <label for="name">Nome:</label>
                <input type="text" id="name" name="name" required>

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" required>

                <label for="gender">Gênero:</label>
                <select id="gender" name="gender" required>
                    <option value="M">Masculino</option>
                    <option value="F">Feminino</option>
                </select>

                <label for="dateOfBirth">Data de Nascimento:</label>
                <input type="date" id="dateOfBirth" name="dateOfBirth" required>

                <label for="telephone">Telefone:</label>
                <input type="text" id="telephone" name="telephone" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="address">Endereço:</label>
                <input type="text" id="address" name="address" required>

                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep" required>

                <label for="houseNumber">Número da Casa:</label>
                <input type="number" id="houseNumber" name="houseNumber" required>

                <label for="clinicId">ID da Clínica:</label>
                <input type="number" id="clinicId" name="clinic.id" required>
            </fieldset>

            <button type="submit">Registrar Paciente</button>
        </form>
    </div>
</main>
</body>

</html>
