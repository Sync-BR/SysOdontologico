<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./../../../src/style/clinic.css">
    <link rel="stylesheet" href="./../../../src/style/reset.css">
    <title>Cadastrar Clínica</title>

</head>
<body>

<header>
    <h1>Sys Odontológico</h1>
    <p>Cadastrar nova clínica</p>
</header>
<div th:if="${message}" class="errorMessage" role="alert">
    <p th:text="${message}"></p>
    <button class="close-btn" onclick="this.parentElement.style.display='none'">×</button>
</div>
<div th:if="${messageSucess}" class="sucessMessage" role="alert">
    <p th:text="${messageSucess}"></p>
    <button class="close-btn" onclick="this.parentElement.style.display='none'">×</button>
</div>
<div class="container">
    <h2>Cadastro de Clínica</h2>
    <form action="/U2FsdGVkX19Y581RvR1+mhL3rDNLJx5/2earo049mttj80LIjLj+zIs8S77+bTeF" method="post">
        <label for="clinicName">Nome da Clínica</label>
        <input type="text" id="clinicName" name="clinicName" placeholder="Digite o nome da clínica" required>

        <label for="clinicCep">CEP</label>
        <input type="text" id="clinicCep" name="clinicCep" placeholder="Digite o CEP" required>

        <label for="clinicAddress">Endereço</label>
        <input type="text" id="clinicAddress" name="clinicAddress" placeholder="Digite o endereço" required>

        <label for="clinicNumber">Número</label>
        <input type="text" id="clinicNumber" name="clinicNumber" placeholder="Digite o número" required>

        <label for="clinicPhone">Telefone</label>
        <input type="text" id="clinicPhone" name="clinicPhone" placeholder="Digite o telefone" required>

        <button type="submit">Cadastrar</button>
    </form>
    <a href="/" class="back-link">Voltar para a página inicial</a>
</div>

</body>
</html>
