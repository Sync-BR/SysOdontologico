<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar Dentista</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        main {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }

        .container {
            margin: 20px;
        }

        fieldset {
            margin-bottom: 20px;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
        }

        legend {
            font-size: 18px;
            font-weight: bold;
            color: #555;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-size: 14px;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        .errorMessage, .sucessMessage {
            background-color: #ffcccc;
            color: #d9534f;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #d9534f;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sucessMessage {
            background-color: #dff0d8;
            color: #3c763d;
            border-color: #d6e9c6;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: #333;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #d9534f;
        }
    </style>
</head>

<body>
<main>
    <div th:if="${message}" class="errorMessage" role="alert">
        <p th:text="${message}"></p>
        <button class="close-btn" onclick="this.parentElement.style.display='none'">×</button>
    </div>
    <div th:if="${messageSucess}" class="sucessMessage" role="alert">
        <p th:text="${messageSucess}"></p>
        <button class="close-btn" onclick="this.parentElement.style.display='none'">×</button>
    </div>
    <div class="container">
        <h1>Registrar Novo Dentista</h1>
        <form action="/U2FsdGVkX19mav0FVJsLPN1KpfZuMpGKl0u3mINTdlzr9kppF4BXEZr9" method="POST">
            <fieldset>
                <legend>Dados Pessoais</legend>
                <label for="name">Nome:</label>
                <input type="text" id="name" name="name" required>

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Telefone:</label>
                <input type="text" id="phone" name="phone" required>

                <label for="dateOfBirth">Data de Nascimento:</label>
                <input type="date" id="dateOfBirth" name="dateOfBirth" required>

                <label for="address">Endereço:</label>
                <input type="text" id="address" name="address" required>
            </fieldset>

            <fieldset>
                <legend>Login</legend>
                <label for="username">Login:</label>
                <input type="text" id="username" name="user.username" required>

                <label for="password">Senha:</label>
                <input type="password" id="password" name="user.password" required>
            </fieldset>

            <button type="submit">Registrar Dentista</button>
        </form>
    </div>
</main>
</body>

</html>
