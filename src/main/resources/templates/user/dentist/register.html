<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./../../../src/style/reset.css">
    <link rel="stylesheet" href="./../../../src/style/dentist/register.css">
    <title>Registrar Dentista</title>

</head>

<body>
<main>
    <div th:if="${message}" class="errorMessage" role="alert">
        <p th:text="${message}"></p>
        <button class="close-btn" onclick="this.parentElement.style.display='none'">×</button>
    </div>
    <div th:if="${messageSucess}" class="sucessMessage" role="alert">
        <p th:text="${messageSucess}"></p>
        <button class="close-btn" onclick="this.parentElement.style.display='none'">×</button>
    </div>
    <div class="container">
        <h1>Registrar Novo Dentista</h1>
        <form action="/U2FsdGVkX19mav0FVJsLPN1KpfZuMpGKl0u3mINTdlzr9kppF4BXEZr9" method="POST">
            <fieldset>
                <legend>Dados Pessoais</legend>
                <label for="name">Nome:</label>
                <input type="text" id="name" name="name" required>

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Telefone:</label>
                <input type="text" id="phone" name="phone" required>

                <label for="dateOfBirth">Data de Nascimento:</label>
                <input type="date" id="dateOfBirth" name="dateOfBirth" required>

                <label for="address">Endereço:</label>
                <input type="text" id="address" name="address" required>
            </fieldset>

            <fieldset>
                <legend>Login</legend>
                <label for="username">Login:</label>
                <input type="text" id="username" name="user.username" required>

                <label for="password">Senha:</label>
                <input type="password" id="password" name="user.password" required>
            </fieldset>

            <button type="submit">Registrar Dentista</button>
        </form>
    </div>
</main>
</body>

</html>
